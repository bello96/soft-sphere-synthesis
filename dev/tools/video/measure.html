<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#111">
<video id="v" muted playsinline preload="auto"></video><canvas id="c"></canvas>
<script>
const v = document.getElementById('v'), c = document.getElementById('c'), g = c.getContext('2d', { willReadFrequently: true });
window.load = src => new Promise(r => { v.onloadedmetadata = () => r({ w: v.videoWidth, h: v.videoHeight, d: v.duration }); v.src = src; });
const seek = t => new Promise(r => { v.onseeked = () => r(); v.currentTime = t; });
async function grab(t, crop) {
  await seek(t);
  const [sx, sy, sw, sh] = crop;
  c.width = sw; c.height = sh;
  g.drawImage(v, sx, sy, sw, sh, 0, 0, sw, sh);
  return g.getImageData(0, 0, sw, sh);
}
window.sample = async (t, crop, x, y) => {
  // dominant bright, saturated colour within 30 px of the seed (skips the dark digits)
  const im = await grab(t, crop), d = im.data, bins = new Map();
  for (let yy = Math.max(0, y - 30); yy < Math.min(im.height, y + 30); yy++) for (let xx = Math.max(0, x - 30); xx < Math.min(im.width, x + 30); xx++) {
    const i = (yy * im.width + xx) * 4, r = d[i], g = d[i+1], b = d[i+2];
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    if (mx < 120 || (mx - mn) / mx < 0.45) continue;
    const k = (r >> 5) * 64 + (g >> 5) * 8 + (b >> 5);
    const e = bins.get(k) || [0, 0, 0, 0]; e[0]++; e[1] += r; e[2] += g; e[3] += b; bins.set(k, e);
  }
  let best = null; for (const e of bins.values()) if (!best || e[0] > best[0]) best = e;
  return best ? [best[1] / best[0], best[2] / best[0], best[3] / best[0]].map(Math.round) : [0, 0, 0];
};
// Track one blob of a given colour: largest component near the seed, holes (digits) filled.
function analyse(im, col, tol, seed) {
  const W = im.width, H = im.height, d = im.data, N = W * H;
  const m = new Uint8Array(N);
  for (let p = 0; p < N; p++) {
    const dr = d[p*4] - col[0], dg = d[p*4+1] - col[1], db = d[p*4+2] - col[2];
    if (dr*dr + dg*dg + db*db <= tol*tol) m[p] = 1;
  }
  // pick the component containing the pixel nearest to the seed
  let best = -1, bd = Infinity;
  for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) if (m[y*W+x]) { const dd = (x-seed[0])**2 + (y-seed[1])**2; if (dd < bd) { bd = dd; best = y*W+x; } }
  if (best < 0) return null;
  const comp = new Uint8Array(N); const st = [best]; comp[best] = 1;
  while (st.length) { const p = st.pop(), x = p % W, y = (p / W) | 0;
    if (x > 0 && m[p-1] && !comp[p-1]) { comp[p-1] = 1; st.push(p-1); }
    if (x < W-1 && m[p+1] && !comp[p+1]) { comp[p+1] = 1; st.push(p+1); }
    if (y > 0 && m[p-W] && !comp[p-W]) { comp[p-W] = 1; st.push(p-W); }
    if (y < H-1 && m[p+W] && !comp[p+W]) { comp[p+W] = 1; st.push(p+W); } }
  // fill holes: flood the complement from the border
  const out = new Uint8Array(N); const q = [];
  for (let x = 0; x < W; x++) { for (const y of [0, H-1]) { const p = y*W+x; if (!comp[p] && !out[p]) { out[p] = 1; q.push(p); } } }
  for (let y = 0; y < H; y++) { for (const x of [0, W-1]) { const p = y*W+x; if (!comp[p] && !out[p]) { out[p] = 1; q.push(p); } } }
  while (q.length) { const p = q.pop(), x = p % W, y = (p / W) | 0;
    for (const n of [x > 0 ? p-1 : -1, x < W-1 ? p+1 : -1, y > 0 ? p-W : -1, y < H-1 ? p+W : -1]) if (n >= 0 && !comp[n] && !out[n]) { out[n] = 1; q.push(n); } }
  let A = 0, sx = 0, sy = 0, per = 0, minX = W, maxX = 0, minY = H, maxY = 0;
  for (let p = 0; p < N; p++) if (!out[p]) { const x = p % W, y = (p / W) | 0; A++; sx += x; sy += y; if (x<minX)minX=x; if (x>maxX)maxX=x; if (y<minY)minY=y; if (y>maxY)maxY=y; }
  const cx = sx / A, cy = sy / A;
  let xx = 0, yy = 0, xy = 0;
  for (let p = 0; p < N; p++) if (!out[p]) { const x = p % W - cx, y = ((p / W) | 0) - cy; xx += x*x; yy += y*y; xy += x*y; }
  xx /= A; yy /= A; xy /= A;
  const tr = xx + yy, det = xx*yy - xy*xy, disc = Math.sqrt(Math.max(0, tr*tr/4 - det));
  const l1 = tr/2 + disc, l2 = tr/2 - disc;
  // boundary pixel count as a rough perimeter
  for (let p = 0; p < N; p++) if (!out[p]) { const x = p % W, y = (p / W) | 0; if (x===0||y===0||x===W-1||y===H-1||out[p-1]||out[p+1]||out[p-W]||out[p+W]) per++; }
  return { A, cx: +cx.toFixed(1), cy: +cy.toFixed(1), w: maxX-minX+1, h: maxY-minY+1, aspect: +Math.sqrt(l1/Math.max(1e-9,l2)).toFixed(2), angle: +(0.5*Math.atan2(2*xy, xx-yy)*180/Math.PI).toFixed(0), per, Q: +(4*Math.PI*A/(per*per)).toFixed(2) };
}
window.track = async (t0, t1, dt, crop, col, tol, seed) => {
  const out = []; let s = seed.slice();
  for (let t = t0; t <= t1 + 1e-9; t += dt) {
    const im = await grab(+t.toFixed(4), crop);
    const r = analyse(im, col, tol, s);
    if (r) s = [r.cx, r.cy];
    out.push({ t: +t.toFixed(3), ...(r || {}) });
  }
  return out;
};
</script></body></html>
